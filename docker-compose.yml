services:
  postgres:
    image: postgres:16-alpine
    container_name: waani-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: waani_user
      POSTGRES_PASSWORD: waani_password
      POSTGRES_DB: waani
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waani_user -d waani"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
